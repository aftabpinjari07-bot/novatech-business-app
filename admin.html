<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NovaTech Admin</title>

  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>

<body>

  <main class="admin-container">

    <section class="admin-login">

      <div class="login-mascot" id="login-mascot" aria-hidden="true">
        <svg viewBox="0 0 72 72" role="presentation">
          <path class="mascot-ear" d="M17 26 13 9l17 10M55 26 59 9 42 19" />
          <circle class="mascot-face" cx="36" cy="38" r="25" />
          <path class="mascot-cheek" d="M18 41c5-3 9-3 13 0m10 0c4-3 8-3 13 0" />
          <g class="mascot-eye-open">
            <ellipse cx="27" cy="34" rx="3.2" ry="4.2" />
            <ellipse cx="45" cy="34" rx="3.2" ry="4.2" />
          </g>
          <g class="mascot-eye-closed">
            <path d="M23 35q4 4 8 0m10 0q4 4 8 0" />
          </g>
          <path class="mascot-nose" d="m33 41 3 3 3-3" />
        </svg>
      </div>

      <h1>NovaTech Admin</h1>

      <p>Admin Login</p>

      <form id="admin-login-form">

        <div class="input-group">
          <label for="admin-email">Email</label>
          <input
            type="email"
            id="admin-email"
            required
          >
        </div>

        <div class="input-group">
          <label for="admin-password">Password</label>
          <div class="password-field">
            <input
              type="password"
              id="admin-password"
              required
            >
            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="password-icon-show" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="password-icon-hide" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 3 18 18M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.3 17.3 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.5 0 2.8-.4 4-1" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="admin-btn">
          Login
        </button>

      </form>

      <p id="login-message"></p>

    </section>

  </main>

</body>
</html>
